<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Wicket &middot; Token Manager</title>
        <link rel="stylesheet" href="/static/css/pico.classless.min.css" />
        <link rel="stylesheet" href="/static/css/app.css" />
    </head>
    <body>
        <main>
            <h1>Token Manager</h1>

            <form id="create-form" autocomplete="off">
                <label>
                    Hosts (comma-separated)
                    <input
                        type="text"
                        name="hosts"
                        placeholder="example.com,*.example.com,192.168.1.1:8080"
                        required
                    />
                </label>
                <label>
                    Email (optional)
                    <input
                        type="email"
                        name="email"
                        id="email-input"
                        placeholder="user@example.com"
                    />
                    <small class="field-error" id="email-error"></small>
                </label>
                <label>
                    Comment (optional)
                    <input
                        type="text"
                        name="comment"
                        placeholder="purpose or notes"
                    />
                </label>
                <label>
                    TTL seconds (optional)
                    <input
                        type="number"
                        name="ttl_seconds"
                        id="ttl-input"
                        min="0"
                        placeholder="3600"
                    />
                </label>
                <div class="ttl-presets">
                    <button type="button" class="ttl-preset" data-ttl="3600">
                        1 hour
                    </button>
                    <button type="button" class="ttl-preset" data-ttl="86400">
                        1 day
                    </button>
                    <button type="button" class="ttl-preset" data-ttl="604800">
                        1 week
                    </button>
                    <button type="button" class="ttl-preset" data-ttl="2592000">
                        30 days
                    </button>
                    <button type="button" class="ttl-preset" data-ttl="0">
                        No expiry
                    </button>
                </div>
                <button type="submit">Create Token</button>
            </form>

            <h2>Current Tokens <span id="token-count"></span></h2>
            <table>
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Hosts</th>
                        <th>Email</th>
                        <th>Comment</th>
                        <th>Created</th>
                        <th>TTL</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="token-table-body"></tbody>
            </table>
            <nav id="pagination"></nav>
        </main>

        <dialog id="token-dialog">
            <article>
                <header>
                    <h3>Token created</h3>
                </header>
                <p>
                    <strong
                        >Save this token now. For security reasons it will not
                        be shown again.</strong
                    >
                    If you lose it, you&rsquo;ll need to issue a new one.
                </p>
                <input type="text" id="token-value" readonly value="" />
                <footer>
                    <button type="button" id="copy-btn">
                        Copy to clipboard
                    </button>
                    <button type="button" id="done-btn" class="secondary">
                        Done
                    </button>
                </footer>
            </article>
        </dialog>

        <dialog id="confirm-dialog">
            <article>
                <header>
                    <h3>Delete token</h3>
                </header>
                <p>
                    You're about to delete token
                    <code id="confirm-token-prefix"></code>
                    for <strong id="confirm-token-hosts"></strong>.
                </p>
                <p><strong>This action cannot be undone.</strong></p>
                <footer>
                    <button type="button" id="confirm-cancel" class="secondary">
                        Cancel
                    </button>
                    <button
                        type="button"
                        id="confirm-delete"
                        class="destructive"
                    >
                        Delete
                    </button>
                </footer>
            </article>
        </dialog>

        <script src="/static/js/app.js"></script>
    </body>
</html>
