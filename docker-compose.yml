services:
  wicket:
    build:
      context: auth_service
      dockerfile: Dockerfile
    init: true
    environment:
      STORAGE_BACKEND: sqlite
      SQLITE_PATH: /data/tokens.db
      PEPPER: ${PEPPER}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
